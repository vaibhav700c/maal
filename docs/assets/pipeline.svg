<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Maal pipeline: cleanse, classify, retrieve, extract, then adversarial verifier and Z3 physics oracle, then deterministic formatters, outputs, review console">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5c6672"/>
    </marker>
    <style>
      .box { fill: #151a20; stroke: #232b35; rx: 10; }
      .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #e9ecef; }
      .s  { font-family: Consolas, Menlo, monospace; font-size: 11.5px; fill: #97a1ad; }
      .w  { stroke: #5c6672; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1200" height="470" fill="#0b0d10"/>

  <!-- top row: linear stages -->
  <rect class="box" x="40"  y="52" width="150" height="64" rx="10"/>
  <text class="t" x="60" y="80">Raw row</text>
  <text class="s" x="60" y="100">MPN + Part_Desc</text>

  <rect class="box" x="240" y="52" width="150" height="64" rx="10"/>
  <text class="t" x="260" y="80">Cleanse</text>
  <text class="s" x="260" y="100">placeholders out</text>

  <rect class="box" x="440" y="52" width="150" height="64" rx="10"/>
  <text class="t" x="460" y="80">Classify</text>
  <text class="s" x="460" y="100">taxonomy path</text>

  <rect class="box" x="640" y="52" width="170" height="64" rx="10"/>
  <text class="t" x="660" y="80">Retrieve</text>
  <text class="s" x="660" y="100">mfr domains only</text>

  <rect class="box" x="860" y="52" width="180" height="64" rx="10"/>
  <text class="t" x="880" y="80">Extract</text>
  <text class="s" x="880" y="100">verbatim evidence</text>

  <line class="w" x1="190" y1="84" x2="234" y2="84"/>
  <line class="w" x1="390" y1="84" x2="434" y2="84"/>
  <line class="w" x1="590" y1="84" x2="634" y2="84"/>
  <line class="w" x1="810" y1="84" x2="854" y2="84"/>

  <!-- split to two auditors -->
  <path class="w" d="M950 116 C950 150, 400 140, 385 176"/>
  <path class="w" d="M950 116 C950 150, 860 150, 855 176"/>

  <rect x="180" y="180" width="410" height="84" rx="10" fill="#151a20" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text class="t" x="204" y="210">Adversarial verifier</text>
  <text class="s" x="204" y="232">a second model tries to refute each value against</text>
  <text class="s" x="204" y="248">its own quoted evidence: CONFIRMED / REFUTED</text>

  <rect x="650" y="180" width="410" height="84" rx="10" fill="#151a20" stroke="#34d399" stroke-opacity="0.55"/>
  <text class="t" x="674" y="210">Z3 physics oracle</text>
  <text class="s" x="674" y="232">P = V x I, ID &lt; OD, unit ranges, mixed units normalized;</text>
  <text class="s" x="674" y="248">unsat core becomes a plain-language reason</text>

  <!-- join to formatters -->
  <path class="w" d="M385 264 C385 300, 590 292, 598 316"/>
  <path class="w" d="M855 264 C855 300, 650 292, 642 316"/>

  <rect class="box" x="380" y="320" width="480" height="64" rx="10"/>
  <text class="t" x="404" y="348">Deterministic formatters</text>
  <text class="s" x="404" y="368">UOM rules, char limits, CAPS, fractions: no free-form generation</text>

  <!-- outputs -->
  <line class="w" x1="620" y1="384" x2="620" y2="410"/>
  <rect class="box" x="220" y="414" width="360" height="44" rx="10"/>
  <text class="t" x="244" y="441">result.csv / result.xlsx</text>
  <text class="s" x="452" y="441">252 columns</text>
  <rect class="box" x="620" y="414" width="360" height="44" rx="10"/>
  <text class="t" x="644" y="441">sidecar.jsonl + review console</text>
  <text class="s" x="900" y="441">provenance</text>
</svg>
